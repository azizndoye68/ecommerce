spring.application.name=ecommerce

server.port=8081

# Base de données PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-with-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
admin.password=${ADMIN_PASSWORD:}
admin.nom=${ADMIN_NOM:Admin}
admin.prenom=${ADMIN_PRENOM:Super}

# Wave Checkout (Sénégal) : une clé API de production ou de test Wave Business.
wave.base-url=${WAVE_BASE_URL:https://api.wave.com}
wave.api-key=${WAVE_API_KEY:}
wave.currency=${WAVE_CURRENCY:XOF}
wave.success-url=${WAVE_SUCCESS_URL:}
wave.error-url=${WAVE_ERROR_URL:}

# Orange Money : les valeurs sont fournies après souscription au service Web Payment.
orange-money.payment-url=${ORANGE_MONEY_PAYMENT_URL:}
orange-money.access-token=${ORANGE_MONEY_ACCESS_TOKEN:}
orange-money.currency=${ORANGE_MONEY_CURRENCY:XOF}
orange-money.success-url=${ORANGE_MONEY_SUCCESS_URL:}
orange-money.cancel-url=${ORANGE_MONEY_CANCEL_URL:}


