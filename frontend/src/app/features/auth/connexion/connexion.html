<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-6 text-center">Connexion</h1>

    @if (erreur$ | async; as erreur) {
      <div class="mb-4 p-3 bg-red-50 text-red-700 rounded text-sm">
        {{ erreur }}
      </div>
    }

    <form [formGroup]="formulaire" (ngSubmit)="soumettre()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        @if (formulaire.get('email')?.invalid && formulaire.get('email')?.touched) {
          <p class="text-red-600 text-sm mt-1">Email invalide</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input
          type="password"
          formControlName="motDePasse"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="(chargement$ | async) ?? false"
        class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 disabled:opacity-50"
      >
        {{ (chargement$ | async) ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Pas encore de compte ?
      <a routerLink="/inscription" class="text-blue-600 hover:underline">S'inscrire</a>
    </p>
  </div>
</div>
