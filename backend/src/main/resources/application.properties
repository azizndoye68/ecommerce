spring.config.import=optional:file:.env[.properties]
spring.application.name=ecommerce

server.port=8081

# Base de données PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
admin.password=${ADMIN_PASSWORD:}
admin.nom=${ADMIN_NOM:Admin}
admin.prenom=${ADMIN_PRENOM:Super}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
security.rate-limit.auth-max=${AUTH_RATE_LIMIT:10}
security.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW:60}
security.session-cleanup-ms=${SESSION_CLEANUP_MS:21600000}

# UniTech Pay (Wave et Orange Money Sénégal). La clé API reste exclusivement côté backend.
unitechpay.base-url=${UNITECHPAY_BASE_URL:https://api.unitech.sn/api.php}
unitechpay.api-key=${UNITECHPAY_API_KEY:}
unitechpay.orange-action=${UNITECHPAY_ORANGE_ACTION:create_orange_om}
unitechpay.callback-success=${UNITECHPAY_CALLBACK_SUCCESS:}
unitechpay.callback-cancel=${UNITECHPAY_CALLBACK_CANCEL:}

# À activer uniquement sur un backend de développement local.
paiement.simulation-active=${PAIEMENT_SIMULATION_ACTIVE:false}

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Limites des fichiers image envoyés depuis l'administration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Envoi des liens de réinitialisation par e-mail (SMTP)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from=${MAIL_FROM:}
password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Stockage des images produit sur Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

