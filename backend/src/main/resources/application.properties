spring.config.import=optional:file:.env[.properties]
spring.application.name=ecommerce

server.port=8081

# Base de données PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
admin.password=${ADMIN_PASSWORD:}
admin.nom=${ADMIN_NOM:Admin}
admin.prenom=${ADMIN_PRENOM:Super}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
security.rate-limit.auth-max=${AUTH_RATE_LIMIT:10}
security.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW:60}
security.session-cleanup-ms=${SESSION_CLEANUP_MS:21600000}

# Wave Checkout (Sénégal) : une clé API de production ou de test Wave Business.
wave.base-url=${WAVE_BASE_URL:https://api.wave.com}
wave.api-key=${WAVE_API_KEY:}
wave.webhook-secret=${WAVE_WEBHOOK_SECRET:}

orange-money.webhook-secret=${ORANGE_MONEY_WEBHOOK_SECRET:}
wave.currency=${WAVE_CURRENCY:XOF}
wave.success-url=${WAVE_SUCCESS_URL:}
wave.error-url=${WAVE_ERROR_URL:}

# Orange Money : les valeurs sont fournies après souscription au service Web Payment.
orange-money.payment-url=${ORANGE_MONEY_PAYMENT_URL:}
orange-money.access-token=${ORANGE_MONEY_ACCESS_TOKEN:}
orange-money.currency=${ORANGE_MONEY_CURRENCY:XOF}
orange-money.success-url=${ORANGE_MONEY_SUCCESS_URL:}
orange-money.cancel-url=${ORANGE_MONEY_CANCEL_URL:}

# À activer uniquement sur un backend de développement local.
paiement.simulation-active=${PAIEMENT_SIMULATION_ACTIVE:false}

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

